
default:
    image: registry.gitlab.com/range.io/ios/curl-jq

stages:
    - test
    - deploy-to-firebase

run-tests:
    stage: test
    script:
        - ./gitrise.sh -w "test" -b $CI_COMMIT_REF_NAME -a $BITRISE_ACCESS_TOKEN -s $BITRISE_APP_SLUG
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"

deploy-to-firebase:
    stage: test
    script:
        - ./gitrise.sh -w "deploy-to-firebase" -b $CI_COMMIT_REF_NAME -a $BITRISE_ACCESS_TOKEN -s $BITRISE_APP_SLUG
    rules:
        - if: $CI_COMMIT_BRANCH == "master"
